<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player Reviews Moderation - Pixel HQ Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            arcadeBg: '#070913',
            arcadeSurface: '#0e1322',
            arcadeCyan: '#00f0ff',
            arcadePink: '#ff007f',
            arcadeYellow: '#ffe600',
            arcadeGreen: '#00ff66',
            arcadeBorder: '#1e2942'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/theme3.css">
</head>
<body data-admin-page="feedback" class="bg-arcadeBg text-slate-100 min-h-screen flex selection:bg-arcadeCyan selection:text-black">

  <!-- Desktop Left Sidebar -->
  <aside class="hidden md:flex flex-col fixed left-0 top-0 bottom-0 w-64 bg-slate-950 border-r-2 border-arcadeCyan z-40">
    <div class="p-5 border-b-2 border-slate-800 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <div class="w-10 h-10 bg-arcadeCyan text-slate-950 flex items-center justify-center font-arcade text-lg shadow-[2px_2px_0px_#0284c7]">
          🕹️
        </div>
        <div>
          <span class="font-arcade text-sm text-white tracking-wider flex items-center gap-1.5">
            PIXEL HQ <span class="text-[9px] px-1 bg-arcadePink text-white">T3</span>
          </span>
          <span class="text-[10px] block text-arcadeGreen font-pixel tracking-wider -mt-0.5">ARCADE CONTROLLER</span>
        </div>
      </a>
    </div>

    <!-- Categorized Navigation (Injected by admin-nav.js) -->
    <div id="adminSidebarNav" class="flex-1 px-2 py-3 space-y-4 overflow-y-auto font-retro text-xs"></div>

    <div class="p-4 border-t-2 border-slate-800 space-y-2 font-retro">
      <a href="../index.html" target="_blank" class="w-full flex items-center justify-between px-3 py-2 bg-arcadeCyan text-slate-950 font-bold border border-cyan-400 text-xs shadow-[2px_2px_0px_#0284c7] transition">
        <span class="flex items-center gap-2">
          <i class="fa-solid fa-arrow-up-right-from-square"></i> Live Arcade Site
        </span>
        <i class="fa-solid fa-external-link text-[10px]"></i>
      </a>
    </div>
  </aside>

  <!-- Mobile Drawer Backdrop -->
  <div id="mobileSidebarOverlay" onclick="toggleMobileSidebar()" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm md:hidden"></div>

  <!-- Mobile Drawer Sidebar -->
  <div id="mobileSidebar" class="fixed top-0 bottom-0 left-0 w-64 bg-slate-950 border-r-2 border-arcadeCyan z-50 transform -translate-x-full transition-transform duration-300 md:hidden flex flex-col font-retro">
    <div class="p-4 border-b border-slate-800 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 bg-arcadeCyan text-slate-950 flex items-center justify-center font-arcade text-xs">
          🕹️
        </div>
        <span class="font-arcade text-white text-xs">PIXEL HQ</span>
      </div>
      <button onclick="toggleMobileSidebar()" class="text-slate-400 hover:text-white p-1">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
    </div>
    <div id="adminMobileNav" class="flex-1 overflow-y-auto px-2 py-3 space-y-4 text-xs font-retro"></div>
  </div>

  <!-- Main Content Area -->
  <div class="md:pl-64 flex-1 flex flex-col min-h-screen">
    
    <!-- Top Header Bar -->
    <header class="sticky top-0 z-30 bg-arcadeBg/95 backdrop-blur-md border-b-2 border-arcadeCyan px-4 sm:px-6 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <button onclick="toggleMobileSidebar()" class="md:hidden p-2 bg-slate-900 text-slate-300 border border-slate-700 text-xs">
          <i class="fa-solid fa-bars text-sm"></i>
        </button>
        <h1 class="text-base sm:text-lg font-bold font-retro text-white">PLAYER RATINGS & REVIEWS MODERATION</h1>
      </div>

      <div class="flex items-center gap-2 font-retro">
        <span class="px-3 py-1 bg-slate-900 border border-slate-800 text-xs text-arcadeYellow font-pixel">
          ★ COMMUNITY RATINGS
        </span>
      </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 w-full flex-1 space-y-6">
      
      <!-- Top Filter Bar -->
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 font-retro">
        <div>
          <h2 class="text-xl font-bold text-white">2D Game Reviews & Ratings</h2>
          <p class="text-xs text-slate-400 font-sans mt-0.5">খেলোয়াড়দের দেওয়া রেটিং ও ফিডব্যাকসমূহ যাচাই করুন।</p>
        </div>

        <div class="flex items-center gap-2 w-full sm:w-auto">
          <label class="text-xs text-slate-400 whitespace-nowrap">FILTER ROM:</label>
          <select id="gameFilterSelect" onchange="renderFeedbackList()" class="px-3 py-1.5 bg-slate-900 border border-slate-800 text-xs text-white">
            <option value="all">ALL 2D GAMES</option>
          </select>
        </div>
      </div>

      <!-- Feedback Grid -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="feedbackGrid">
        <!-- Injected by JS -->
      </div>
    </main>

    <footer class="p-4 text-center text-xs text-slate-500 font-sans border-t border-slate-900 mt-auto">
      © 2026 PIXEL WAP 2D BD.
    </footer>
  </div>

  <!-- Shared Unified Database -->
  <script src="../assets/js/db.js"></script>
  <script src="assets/admin-nav.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      populateGameFilter();
      renderFeedbackList();
    });

    function toggleMobileSidebar() {
      const sidebar = document.getElementById('mobileSidebar');
      const overlay = document.getElementById('mobileSidebarOverlay');
      sidebar.classList.toggle('-translate-x-full');
      overlay.classList.toggle('hidden');
    }

    function populateGameFilter() {
      const games = window.wapDB.getGames();
      const select = document.getElementById('gameFilterSelect');
      games.forEach(g => {
        const opt = document.createElement('option');
        opt.value = g.id;
        opt.innerText = g.title;
        select.appendChild(opt);
      });
    }

    function renderFeedbackList() {
      const filter = document.getElementById('gameFilterSelect').value;
      const reviews = filter === 'all' ? window.wapDB.getReviews() : window.wapDB.getReviews(filter);
      const grid = document.getElementById('feedbackGrid');

      if (!reviews || reviews.length === 0) {
        grid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400 text-xs font-sans">No feedback found for this selection.</div>`;
        return;
      }

      grid.innerHTML = reviews.map(r => {
        const game = window.wapDB.getGameById(r.gameId);
        const gameTitle = game ? game.title : '2D Game';
        return `
          <div class="arcade-card p-5 flex flex-col justify-between font-retro">
            <div>
              <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-bold text-white flex items-center gap-1.5">
                  <span class="w-5 h-5 bg-arcadeCyan/30 text-arcadeCyan text-[10px] flex items-center justify-center font-bold font-arcade">
                    ${r.playerName.charAt(0)}
                  </span>
                  ${r.playerName}
                </span>
                <span class="text-arcadeYellow text-xs font-mono">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</span>
              </div>
              <div class="text-[11px] text-arcadeCyan font-bold mb-2">Game: ${gameTitle}</div>
              <p class="text-xs text-slate-300 leading-relaxed bg-slate-950 p-3 border border-slate-800 mb-3 font-sans">
                "${r.comment}"
              </p>
            </div>

            <div class="flex items-center justify-between text-[10px] text-slate-400 font-mono pt-2 border-t border-slate-800">
              <span>Date: ${r.date}</span>
              <span class="text-arcadeGreen font-bold font-retro">● Verified Player</span>
            </div>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
