<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tournaments Setup - Pixel HQ Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            arcadeBg: '#070913',
            arcadeSurface: '#0e1322',
            arcadeCyan: '#00f0ff',
            arcadePink: '#ff007f',
            arcadeYellow: '#ffe600',
            arcadeGreen: '#00ff66',
            arcadeBorder: '#1e2942'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/theme3.css">
</head>
<body data-admin-page="campaigns" class="bg-arcadeBg text-slate-100 min-h-screen flex selection:bg-arcadeCyan selection:text-black">

  <!-- Desktop Left Sidebar -->
  <aside class="hidden md:flex flex-col fixed left-0 top-0 bottom-0 w-64 bg-slate-950 border-r-2 border-arcadeCyan z-40">
    <div class="p-5 border-b-2 border-slate-800 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <div class="w-10 h-10 bg-arcadeCyan text-slate-950 flex items-center justify-center font-arcade text-lg shadow-[2px_2px_0px_#0284c7]">
          🕹️
        </div>
        <div>
          <span class="font-arcade text-sm text-white tracking-wider flex items-center gap-1.5">
            PIXEL HQ <span class="text-[9px] px-1 bg-arcadePink text-white">T3</span>
          </span>
          <span class="text-[10px] block text-arcadeGreen font-pixel tracking-wider -mt-0.5">ARCADE CONTROLLER</span>
        </div>
      </a>
    </div>

    <!-- Categorized Navigation (Injected by admin-nav.js) -->
    <div id="adminSidebarNav" class="flex-1 px-2 py-3 space-y-4 overflow-y-auto font-retro text-xs"></div>

    <div class="p-4 border-t-2 border-slate-800 space-y-2 font-retro">
      <a href="../index.html" target="_blank" class="w-full flex items-center justify-between px-3 py-2 bg-arcadeCyan text-slate-950 font-bold border border-cyan-400 text-xs shadow-[2px_2px_0px_#0284c7] transition">
        <span class="flex items-center gap-2">
          <i class="fa-solid fa-arrow-up-right-from-square"></i> Live Arcade Site
        </span>
        <i class="fa-solid fa-external-link text-[10px]"></i>
      </a>
    </div>
  </aside>

  <!-- Mobile Drawer Backdrop -->
  <div id="mobileSidebarOverlay" onclick="toggleMobileSidebar()" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm md:hidden"></div>

  <!-- Mobile Drawer Sidebar -->
  <div id="mobileSidebar" class="fixed top-0 bottom-0 left-0 w-64 bg-slate-950 border-r-2 border-arcadeCyan z-50 transform -translate-x-full transition-transform duration-300 md:hidden flex flex-col font-retro">
    <div class="p-4 border-b border-slate-800 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 bg-arcadeCyan text-slate-950 flex items-center justify-center font-arcade text-xs">
          🕹️
        </div>
        <span class="font-arcade text-white text-xs">PIXEL HQ</span>
      </div>
      <button onclick="toggleMobileSidebar()" class="text-slate-400 hover:text-white p-1">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
    </div>
    <div id="adminMobileNav" class="flex-1 overflow-y-auto px-2 py-3 space-y-4 text-xs font-retro"></div>
  </div>

  <!-- Main Content Area -->
  <div class="md:pl-64 flex-1 flex flex-col min-h-screen">
    
    <!-- Top Header Bar -->
    <header class="sticky top-0 z-30 bg-arcadeBg/95 backdrop-blur-md border-b-2 border-arcadeCyan px-4 sm:px-6 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <button onclick="toggleMobileSidebar()" class="md:hidden p-2 bg-slate-900 text-slate-300 border border-slate-700 text-xs">
          <i class="fa-solid fa-bars text-sm"></i>
        </button>
        <h1 class="text-base sm:text-lg font-bold font-retro text-white">TOURNAMENTS SETUP & SEASONS</h1>
      </div>

      <button onclick="openTournamentModal()" class="btn-arcade-yellow px-4 py-2 text-xs font-bold flex items-center gap-1.5 font-retro">
        <i class="fa-solid fa-trophy"></i> CREATE NEW TOURNAMENT
      </button>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 w-full flex-1">
      
      <!-- Top Filter & Stats Bar -->
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-6">
        <div>
          <h2 class="text-xl font-bold font-retro text-white">Arcade Cash Tournament Ladders</h2>
          <p class="text-xs text-slate-400 font-sans">সেট করুন ক্যাশ প্রাইজ পুল (বিকাশ), এন্ট্রি ফি ও ডেট উইন্ডো।</p>
        </div>

        <!-- Status Filter -->
        <div class="flex items-center gap-1.5" id="trnFilterArea">
          <button onclick="setTrnFilter('all')" class="t-filter active px-3 py-1 text-xs font-bold font-retro bg-arcadeCyan text-slate-950 border border-cyan-400">ALL SEASONS</button>
          <button onclick="setTrnFilter('Active')" class="t-filter px-3 py-1 text-xs font-bold font-retro bg-slate-900 text-slate-300 border border-slate-800">ACTIVE</button>
          <button onclick="setTrnFilter('Upcoming')" class="t-filter px-3 py-1 text-xs font-bold font-retro bg-slate-900 text-slate-300 border border-slate-800">UPCOMING</button>
        </div>
      </div>

      <!-- Tournaments Grid -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="adminTournamentsGrid">
        <!-- Injected by JS -->
      </div>
    </main>

    <footer class="p-4 text-center text-xs text-slate-500 font-sans border-t border-slate-900 mt-auto">
      © 2026 PIXEL WAP 2D BD (Theme 3 Operator Terminal).
    </footer>
  </div>

  <!-- Tournament Setup / Edit Modal -->
  <div id="trnModal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="w-full max-w-xl arcade-card p-6 border-2 border-arcadeYellow relative max-h-[90vh] overflow-y-auto font-retro">
      <button onclick="closeTournamentModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>

      <h3 class="text-base font-bold text-white mb-4 flex items-center gap-2" id="trnModalTitle">
        <i class="fa-solid fa-trophy text-arcadeYellow"></i> Setup New Tournament
      </h3>

      <form onsubmit="handleSaveTournament(event)" class="space-y-3.5 font-sans text-xs">
        <input type="hidden" id="editTrnId">

        <div>
          <label class="block text-xs font-bold font-retro text-slate-300 mb-1">Tournament Title</label>
          <input type="text" id="trnTitleInput" required placeholder="e.g. Pixel Invaders Championship"
                 class="w-full px-3 py-2 bg-slate-950 border border-slate-800 text-xs text-white">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold font-retro text-slate-300 mb-1">Target 2D Game</label>
            <select id="trnGameSelect" required class="w-full px-3 py-2 bg-slate-950 border border-slate-800 text-xs text-white">
              <!-- Populated by JS -->
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold font-retro text-slate-300 mb-1">Format</label>
            <select id="trnTypeInput" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 text-xs text-white">
              <option value="Single Player">Single Player (High Score)</option>
              <option value="Multiplayer">Multiplayer (Live Bracket)</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold font-retro text-slate-300 mb-1">Prize Pool</label>
            <input type="text" id="trnPrizeInput" required placeholder="e.g. 1,500 TK Cash (bKash)"
                   class="w-full px-3 py-2 bg-slate-950 border border-slate-800 text-xs text-white font-mono">
          </div>
          <div>
            <label class="block text-xs font-bold font-retro text-slate-300 mb-1">Status</label>
            <select id="trnStatusInput" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 text-xs text-white">
              <option value="Active">Active (Open)</option>
              <option value="Upcoming">Upcoming</option>
              <option value="Completed">Completed</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold font-retro text-slate-300 mb-1">Entry Fee Currency</label>
            <select id="trnFeeTypeInput" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 text-xs text-white">
              <option value="money">Cash TK (bKash)</option>
              <option value="token">Token Coins (🪙)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold font-retro text-slate-300 mb-1">Entry Fee Amount</label>
            <input type="number" id="trnFeeAmountInput" required min="0" value="10"
                   class="w-full px-3 py-2 bg-slate-950 border border-slate-800 text-xs text-white">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold font-retro text-slate-300 mb-1">Start Date</label>
            <input type="date" id="trnStartDateInput" required
                   class="w-full px-3 py-2 bg-slate-950 border border-slate-800 text-xs text-white">
          </div>
          <div>
            <label class="block text-xs font-bold font-retro text-slate-300 mb-1">End Date</label>
            <input type="date" id="trnEndDateInput" required
                   class="w-full px-3 py-2 bg-slate-950 border border-slate-800 text-xs text-white">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold font-retro text-slate-300 mb-1">Tournament Rules</label>
          <textarea id="trnRulesInput" rows="3" required
                    class="w-full px-3 py-2 bg-slate-950 border border-slate-800 text-xs text-white"
                    placeholder="Must hold active pass. Top highest scores receive bKash cash prizes..."></textarea>
        </div>

        <div class="pt-3 flex justify-end gap-2 font-retro">
          <button type="button" onclick="closeTournamentModal()" class="px-4 py-2 text-xs bg-slate-800 text-slate-300">
            Cancel
          </button>
          <button type="submit" class="btn-arcade-yellow px-5 py-2 text-xs font-bold">
            SAVE TOURNAMENT
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Shared Unified Database -->
  <script src="../assets/js/db.js"></script>
  <script src="assets/admin-nav.js"></script>
  <script>
    let activeTrnFilter = 'all';

    document.addEventListener('DOMContentLoaded', () => {
      populateGameSelect();
      renderTournaments();
    });

    function toggleMobileSidebar() {
      const sidebar = document.getElementById('mobileSidebar');
      const overlay = document.getElementById('mobileSidebarOverlay');
      sidebar.classList.toggle('-translate-x-full');
      overlay.classList.toggle('hidden');
    }

    function populateGameSelect() {
      const games = window.wapDB.getGames();
      const select = document.getElementById('trnGameSelect');
      select.innerHTML = games.map(g => `<option value="${g.id}">${g.title} (${g.category})</option>`).join('');
    }

    function setTrnFilter(f) {
      activeTrnFilter = f;
      document.querySelectorAll('.t-filter').forEach(btn => {
        btn.classList.remove('active', 'bg-arcadeCyan', 'text-slate-950', 'border-cyan-400');
        btn.classList.add('bg-slate-900', 'text-slate-300', 'border-slate-800');
      });
      event.target.classList.add('active', 'bg-arcadeCyan', 'text-slate-950', 'border-cyan-400');
      event.target.classList.remove('bg-slate-900', 'text-slate-300', 'border-slate-800');
      renderTournaments();
    }

    function renderTournaments() {
      const all = window.wapDB.getTournaments();
      const filtered = activeTrnFilter === 'all'
        ? all
        : all.filter(t => t.status === activeTrnFilter);

      const grid = document.getElementById('adminTournamentsGrid');
      
      if (!filtered || filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400 text-xs">No tournaments found.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(t => {
        return `
          <div class="arcade-card p-5 flex flex-col justify-between font-retro">
            <div>
              <div class="flex items-center justify-between mb-3">
                <span class="px-2.5 py-0.5 text-[9px] font-bold ${t.status === 'Active' ? 'bg-arcadePink text-white' : 'bg-slate-800 text-arcadeYellow'}">
                  ● ${t.status}
                </span>
                <span class="text-xs text-slate-400 font-pixel"><i class="fa-solid fa-users text-arcadeCyan"></i> ${t.participantsCount} JOINED</span>
              </div>

              <h3 class="text-base font-bold text-white">${t.title}</h3>
              <p class="text-xs text-arcadeCyan mt-0.5">Game: ${t.gameTitle} (${t.type})</p>
              
              <div class="my-4 p-3 bg-slate-950 border border-slate-800 flex items-center justify-between">
                <div>
                  <div class="text-[10px] text-slate-400 uppercase">Prize Pool</div>
                  <div class="text-base font-bold text-arcadeYellow">${t.prizePool}</div>
                </div>
                <div class="text-right">
                  <div class="text-[10px] text-slate-400 uppercase">Entry Fee</div>
                  <div class="text-xs font-bold text-slate-200">
                    ${t.entryFeeType === 'token' ? `${t.entryFee} Coins` : `${t.entryFee} TK (bKash)`}
                  </div>
                </div>
              </div>

              <p class="text-xs text-slate-400 mb-2 font-sans">${t.rules}</p>
              <div class="text-[10px] text-slate-500 font-mono mb-4">Dates: ${t.startDate} to ${t.endDate}</div>
            </div>

            <div class="flex items-center gap-2 pt-3 border-t border-slate-800">
              <button onclick="editTournament('${t.id}')" class="flex-1 py-1.5 text-xs font-bold bg-slate-900 hover:bg-slate-800 text-arcadeCyan border border-slate-700">
                <i class="fa-solid fa-pen-to-square"></i> Edit
              </button>
              <button onclick="deleteTournament('${t.id}', '${t.title}')" class="px-3 py-1.5 text-xs font-bold bg-red-950/60 hover:bg-red-900 text-red-300 border border-red-700/50">
                <i class="fa-solid fa-trash"></i>
              </button>
              <a href="../player/play.html?id=${t.gameId}&tournament=${t.id}" target="_blank" class="px-3 py-1.5 text-xs font-bold btn-arcade-cyan" title="Open in Arcade">
                <i class="fa-solid fa-play"></i>
              </a>
            </div>
          </div>
        `;
      }).join('');
    }

    function openTournamentModal(t = null) {
      const modal = document.getElementById('trnModal');
      const title = document.getElementById('trnModalTitle');
      
      if (t) {
        title.innerHTML = `<i class="fa-solid fa-pen-to-square text-arcadeCyan"></i> Edit Tournament: ${t.title}`;
        document.getElementById('editTrnId').value = t.id;
        document.getElementById('trnTitleInput').value = t.title;
        document.getElementById('trnGameSelect').value = t.gameId;
        document.getElementById('trnTypeInput').value = t.type;
        document.getElementById('trnPrizeInput').value = t.prizePool;
        document.getElementById('trnStatusInput').value = t.status;
        document.getElementById('trnFeeTypeInput').value = t.entryFeeType;
        document.getElementById('trnFeeAmountInput').value = t.entryFee;
        document.getElementById('trnStartDateInput').value = t.startDate;
        document.getElementById('trnEndDateInput').value = t.endDate;
        document.getElementById('trnRulesInput').value = t.rules;
      } else {
        title.innerHTML = `<i class="fa-solid fa-trophy text-arcadeYellow"></i> Setup New Tournament`;
        document.getElementById('editTrnId').value = '';
        document.getElementById('trnTitleInput').value = '';
        document.getElementById('trnTypeInput').value = 'Single Player';
        document.getElementById('trnPrizeInput').value = '1,500 TK Cash (bKash)';
        document.getElementById('trnStatusInput').value = 'Active';
        document.getElementById('trnFeeTypeInput').value = 'money';
        document.getElementById('trnFeeAmountInput').value = '10';
        document.getElementById('trnStartDateInput').value = new Date().toISOString().split('T')[0];
        document.getElementById('trnEndDateInput').value = new Date(Date.now() + 7 * 86400000).toISOString().split('T')[0];
        document.getElementById('trnRulesInput').value = 'Play any time during active season. Highest scores win cash prizes directly to bKash account!';
      }

      modal.classList.remove('hidden');
    }

    function closeTournamentModal() {
      document.getElementById('trnModal').classList.add('hidden');
    }

    function editTournament(id) {
      const t = window.wapDB.getTournamentById(id);
      if (t) openTournamentModal(t);
    }

    function deleteTournament(id, title) {
      if (confirm(`Delete tournament "${title}"?`)) {
        window.wapDB.deleteTournament(id);
        renderTournaments();
      }
    }

    function handleSaveTournament(e) {
      e.preventDefault();
      const id = document.getElementById('editTrnId').value;
      const gameId = document.getElementById('trnGameSelect').value;
      const game = window.wapDB.getGameById(gameId);

      const trnData = {
        title: document.getElementById('trnTitleInput').value.trim(),
        gameId: gameId,
        gameTitle: game ? game.title : '2D Game',
        type: document.getElementById('trnTypeInput').value,
        prizePool: document.getElementById('trnPrizeInput').value.trim(),
        status: document.getElementById('trnStatusInput').value,
        entryFeeType: document.getElementById('trnFeeTypeInput').value,
        entryFee: parseInt(document.getElementById('trnFeeAmountInput').value) || 0,
        startDate: document.getElementById('trnStartDateInput').value,
        endDate: document.getElementById('trnEndDateInput').value,
        rules: document.getElementById('trnRulesInput').value.trim()
      };

      if (id) {
        trnData.id = id;
      }

      window.wapDB.saveTournament(trnData);
      closeTournamentModal();
      renderTournaments();
      alert('Tournament saved successfully!');
    }
  </script>
</body>
</html>
