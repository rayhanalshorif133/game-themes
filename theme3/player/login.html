<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player Login - Pixel WAP 2D Arcade</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            arcadeBg: '#070913',
            arcadeSurface: '#0e1322',
            arcadeCyan: '#00f0ff',
            arcadePink: '#ff007f',
            arcadeYellow: '#ffe600',
            arcadeGreen: '#00ff66',
            arcadeBorder: '#1e2942'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/theme3.css">
</head>
<body class="bg-arcadeBg text-slate-100 min-h-screen flex flex-col justify-between selection:bg-arcadeCyan selection:text-black">

  <!-- Header -->
  <header class="bg-arcadeBg/95 border-b-2 border-arcadeCyan px-4 py-3 sticky top-0 z-30">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <a href="../index.html" class="flex items-center gap-3">
        <div class="w-9 h-9 bg-arcadeCyan text-slate-950 flex items-center justify-center text-lg font-arcade border border-cyan-300 shadow-[2px_2px_0px_#0284c7]">
          🕹️
        </div>
        <div>
          <span class="font-arcade text-xs sm:text-sm text-transparent bg-clip-text bg-gradient-to-r from-arcadeCyan to-arcadePink">PIXEL WAP</span>
          <span class="text-[9px] block text-arcadeGreen font-pixel tracking-wider -mt-0.5">THEME 3 ARCADE</span>
        </div>
      </a>

      <div class="flex items-center gap-2">
        <a href="../../Theme1/player/login.html" class="px-2.5 py-1 text-[10px] font-retro bg-slate-900 border border-slate-700 text-slate-300 hover:text-white">
          Theme 1 Login
        </a>
        <a href="../../theme2/player/login.html" class="px-2.5 py-1 text-[10px] font-retro bg-slate-900 border border-slate-700 text-amber-400 hover:text-amber-300">
          Theme 2 Login
        </a>
      </div>
    </div>
  </header>

  <!-- Main Login Card -->
  <main class="max-w-md mx-auto px-4 py-10 w-full flex-1 flex flex-col justify-center">
    
    <div class="arcade-card p-6 sm:p-8 bg-slate-950/95 border-2 border-arcadeCyan shadow-[6px_6px_0px_rgba(0,240,255,0.4)]">
      
      <!-- Top Title -->
      <div class="text-center mb-6">
        <div class="inline-block px-3 py-1 bg-arcadePink text-white font-retro font-bold text-xs shadow-[2px_2px_0px_#9f1239] mb-3">
          PRESS 1P START
        </div>
        <h2 class="text-2xl font-extrabold font-retro text-white">PLAYER AUTHENTICATION</h2>
        <p class="text-xs text-slate-400 mt-1 font-sans">নতুন সাইন আপ করলেই পাবেন <strong class="text-arcadeYellow font-retro">৫০ ফ্রি টোকেন কয়েন</strong>!</p>
      </div>

      <!-- Tab Switcher -->
      <div class="flex border-b-2 border-slate-800 mb-6 font-retro">
        <button id="tabLoginBtn" onclick="switchTab('login')" class="flex-1 py-2 text-xs font-bold text-arcadeCyan border-b-2 border-arcadeCyan -mb-[2px] transition">
          SIGN IN (লগইন)
        </button>
        <button id="tabSignupBtn" onclick="switchTab('signup')" class="flex-1 py-2 text-xs font-bold text-slate-400 hover:text-slate-200 transition">
          NEW PLAYER (+50 COINS)
        </button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold font-retro text-slate-300 mb-1">PHONE NUMBER (ফোন নম্বর)</label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs font-mono">+88</span>
            <input type="tel" id="loginPhone" required placeholder="01700000000"
                   class="w-full pl-12 pr-4 py-2.5 bg-slate-900 border-2 border-slate-800 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-arcadeCyan font-mono">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold font-retro text-slate-300 mb-1">PASSWORD (পাসওয়ার্ড)</label>
          <input type="password" id="loginPass" required placeholder="••••••••"
                 class="w-full px-4 py-2.5 bg-slate-900 border-2 border-slate-800 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-arcadeCyan font-mono">
        </div>

        <button type="submit" class="btn-arcade-cyan w-full py-3 text-xs font-extrabold tracking-wider">
          <i class="fa-solid fa-right-to-bracket mr-1.5"></i> START GAME (LOGIN)
        </button>
      </form>

      <!-- Signup Form -->
      <form id="signupForm" onsubmit="handleSignup(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-bold font-retro text-slate-300 mb-1">PLAYER NAME (গেমার নাম)</label>
          <input type="text" id="signupName" required placeholder="e.g. PixelHero"
                 class="w-full px-4 py-2.5 bg-slate-900 border-2 border-slate-800 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-arcadeCyan">
        </div>

        <div>
          <label class="block text-xs font-bold font-retro text-slate-300 mb-1">PHONE NUMBER (ফোন নম্বর)</label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs font-mono">+88</span>
            <input type="tel" id="signupPhone" required placeholder="01700000000"
                   class="w-full pl-12 pr-4 py-2.5 bg-slate-900 border-2 border-slate-800 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-arcadeCyan font-mono">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold font-retro text-slate-300 mb-1">PASSWORD (পাসওয়ার্ড)</label>
          <input type="password" id="signupPass" required placeholder="Minimum 4 characters"
                 class="w-full px-4 py-2.5 bg-slate-900 border-2 border-slate-800 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-arcadeCyan font-mono">
        </div>

        <div>
          <label class="block text-xs font-bold font-retro text-slate-300 mb-1">REFERRAL CODE (যদি থাকে)</label>
          <input type="text" id="signupRef" placeholder="e.g. WAP2026"
                 class="w-full px-4 py-2.5 bg-slate-900 border-2 border-slate-800 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-arcadeCyan font-mono uppercase">
          <p class="text-[10px] text-arcadeGreen mt-1 font-retro">বন্ধু রেফার করলে আপনি পাবেন আরো ২৫ টোকেন কয়েন!</p>
        </div>

        <button type="submit" class="btn-arcade-pink w-full py-3 text-xs font-extrabold tracking-wider">
          <i class="fa-solid fa-coins mr-1.5"></i> CLAIM 50 COINS & SIGN UP
        </button>
      </form>

      <!-- 1-Click Demo Accounts -->
      <div class="mt-8 pt-4 border-t-2 border-slate-800 text-center font-retro">
        <div class="text-[10px] text-slate-400 uppercase mb-2">QUICK TEST ACCOUNTS (1-CLICK)</div>
        <div class="grid grid-cols-2 gap-2 text-xs">
          <button type="button" onclick="quickFill('01711111111', '1234')" class="p-2 bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-300">
            <div class="font-bold text-arcadeCyan">Pro Gamer</div>
            <div class="text-[10px] text-slate-400">Has 3 TK Pass</div>
          </button>
          <button type="button" onclick="quickFill('01822222222', '1234')" class="p-2 bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-300">
            <div class="font-bold text-arcadePink">Newbie Gamer</div>
            <div class="text-[10px] text-slate-400">50 Coins / No Pass</div>
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="p-4 text-center text-xs text-slate-500 font-sans border-t border-slate-900">
    © 2026 PIXEL WAP 2D BD (Theme 3). Need help? <a href="https://wa.me/8801700000000" class="text-arcadeCyan hover:underline font-retro">WhatsApp Support</a>
  </footer>

  <!-- Unified Shared Database -->
  <script src="../../assets/js/db.js"></script>
  <script>
    let activeTab = 'login';

    function switchTab(tab) {
      activeTab = tab;
      const loginForm = document.getElementById('loginForm');
      const signupForm = document.getElementById('signupForm');
      const tabLoginBtn = document.getElementById('tabLoginBtn');
      const tabSignupBtn = document.getElementById('tabSignupBtn');

      if (tab === 'login') {
        loginForm.classList.remove('hidden');
        signupForm.classList.add('hidden');
        tabLoginBtn.className = 'flex-1 py-2 text-xs font-bold text-arcadeCyan border-b-2 border-arcadeCyan -mb-[2px] transition';
        tabSignupBtn.className = 'flex-1 py-2 text-xs font-bold text-slate-400 hover:text-slate-200 transition';
      } else {
        loginForm.classList.add('hidden');
        signupForm.classList.remove('hidden');
        tabSignupBtn.className = 'flex-1 py-2 text-xs font-bold text-arcadePink border-b-2 border-arcadePink -mb-[2px] transition';
        tabLoginBtn.className = 'flex-1 py-2 text-xs font-bold text-slate-400 hover:text-slate-200 transition';
      }
    }

    function quickFill(phone, pass) {
      switchTab('login');
      document.getElementById('loginPhone').value = phone;
      document.getElementById('loginPass').value = pass;
    }

    function handleLogin(e) {
      e.preventDefault();
      const phone = document.getElementById('loginPhone').value.trim();
      const pass = document.getElementById('loginPass').value.trim();

      const res = window.wapDB.login(phone, pass);
      if (res.success) {
        alert(`Welcome back, ${res.player.name}! Entering Pixel Lobby...`);
        window.location.href = 'index.html';
      } else {
        alert(res.message);
      }
    }

    function handleSignup(e) {
      e.preventDefault();
      const name = document.getElementById('signupName').value.trim();
      const phone = document.getElementById('signupPhone').value.trim();
      const pass = document.getElementById('signupPass').value.trim();
      const ref = document.getElementById('signupRef').value.trim();

      const res = window.wapDB.signup({
        name,
        phone,
        password: pass,
        referralCodeInput: ref
      });

      if (res.success) {
        alert(`Congratulations ${res.player.name}! 50 Free Coins added to your arcade vault!`);
        window.location.href = 'index.html';
      } else {
        alert(res.message);
      }
    }
  </script>
</body>
</html>
