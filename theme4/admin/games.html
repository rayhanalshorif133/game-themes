<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Games Roster Management - PRO ARENA Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            proDark: '#08090C',
            proSurface: '#10131A',
            proElevated: '#161B26',
            proAccent: '#6366F1',
            proViolet: '#8B5CF6'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/theme4.css">
</head>
<body class="bg-proDark text-slate-100 min-h-screen flex selection:bg-proAccent selection:text-white">

  <!-- Desktop Left Sidebar -->
  <aside class="hidden md:flex flex-col fixed left-0 top-0 bottom-0 w-64 bg-proSurface border-r border-white/[0.08] z-40">
    <div class="p-5 border-b border-white/[0.08] flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-proElevated border border-white/[0.1] text-proAccent flex items-center justify-center font-bold text-sm shadow-sm">
          <i class="fa-solid fa-crosshairs"></i>
        </div>
        <div>
          <span class="font-heading font-bold text-sm text-white tracking-tight flex items-center gap-1.5">
            PRO ARENA <span class="text-[9px] px-1.5 py-0.5 rounded bg-proAccent text-white font-mono-stat">T4</span>
          </span>
          <span class="text-[10px] block text-slate-400 font-mono-stat -mt-0.5">MARSHAL CONTROL</span>
        </div>
      </a>
    </div>

    <div class="flex-1 px-3 py-4 space-y-1 overflow-y-auto font-mono-stat text-xs">
      <div class="px-3 pb-2 text-[10px] font-bold text-slate-500 uppercase tracking-wider">MANAGEMENT</div>
      <a href="index.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-white hover:bg-proElevated transition">
        <i class="fa-solid fa-gauge-high w-4 text-center"></i>
        <span>Dashboard</span>
      </a>
      <a href="games.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-proElevated text-white font-semibold border border-white/[0.1]">
        <i class="fa-solid fa-gamepad w-4 text-center text-proAccent"></i>
        <span>2D Games Roster</span>
      </a>
      <a href="tournaments.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-white hover:bg-proElevated transition">
        <i class="fa-solid fa-trophy w-4 text-center text-amber-400"></i>
        <span>Tournaments & Cups</span>
      </a>
      <a href="players.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-white hover:bg-proElevated transition">
        <i class="fa-solid fa-users w-4 text-center text-proViolet"></i>
        <span>Players & Bans</span>
      </a>
      <a href="sms.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-white hover:bg-proElevated transition">
        <i class="fa-solid fa-comment-sms w-4 text-center text-emerald-400"></i>
        <span>SMS Broadcast</span>
      </a>
      <a href="subscriptions.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-white hover:bg-proElevated transition">
        <i class="fa-solid fa-receipt w-4 text-center text-bkash"></i>
        <span>Passes & Revenue</span>
      </a>
      <a href="feedback.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-white hover:bg-proElevated transition">
        <i class="fa-solid fa-star w-4 text-center text-amber-400"></i>
        <span>Player Reviews</span>
      </a>
    </div>

    <div class="p-3 border-t border-white/[0.08] space-y-2 font-mono-stat text-[11px]">
      <a href="../player/index.html" class="w-full py-2 px-3 rounded-lg bg-proElevated hover:bg-black text-slate-300 flex items-center justify-center gap-2 border border-white/[0.08] transition">
        <i class="fa-solid fa-play text-proAccent text-[10px]"></i> Open Player Arena
      </a>
      <a href="../../index.html" class="w-full py-1.5 px-3 rounded text-slate-500 hover:text-white flex items-center justify-center gap-1.5 transition">
        <i class="fa-solid fa-layer-group text-[10px]"></i> Theme Hub
      </a>
    </div>
  </aside>

  <!-- Main Content Wrapper -->
  <div class="flex-1 md:ml-64 flex flex-col min-h-screen">
    
    <!-- Top Action Bar -->
    <header class="h-16 border-b border-white/[0.08] bg-proDark/80 px-6 flex items-center justify-between backdrop-blur-md sticky top-0 z-20">
      <div>
        <h1 class="font-heading font-bold text-base text-white">2D Games Catalog Manager</h1>
        <span class="text-[10px] text-slate-500 font-mono-stat">UPLOAD, EDIT & DELETE 2D TITLES</span>
      </div>

      <button onclick="openGameModal()" class="btn-pro-primary px-3.5 py-1.5 text-xs font-mono-stat font-semibold flex items-center gap-1.5">
        <i class="fa-solid fa-plus text-[10px]"></i> Upload New Game
      </button>
    </header>

    <!-- Page Body -->
    <main class="p-6 space-y-6 flex-1">
      
      <!-- Games Grid -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="adminGamesGrid">
        <!-- Injected by JS -->
      </div>

    </main>

    <!-- Add/Edit Game Modal -->
    <div id="gameModal" class="hidden fixed inset-0 bg-black/85 flex items-center justify-center p-4 z-50">
      <div class="pro-card p-6 bg-proSurface border-white/[0.15] w-full max-w-lg max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between pb-3 mb-4 border-b border-white/[0.08]">
          <h3 class="font-bold text-white text-sm font-heading" id="modalHeading">Deploy Game Title</h3>
          <button onclick="closeGameModal()" class="text-slate-400 hover:text-white text-sm">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <form onsubmit="handleSaveGame(event)" class="space-y-4 font-mono-stat text-xs">
          <input type="hidden" id="editGameId">

          <div>
            <label class="block text-slate-300 mb-1">Game Title</label>
            <input type="text" id="gTitle" required placeholder="e.g. Laser Storm 2D"
                   class="w-full px-3 py-2 bg-black/50 border border-white/[0.1] rounded-lg text-white">
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-slate-300 mb-1">Category</label>
              <select id="gCategory" class="w-full px-3 py-2 bg-black/50 border border-white/[0.1] rounded-lg text-white">
                <option value="Action">Action</option>
                <option value="Arcade">Arcade</option>
                <option value="Classic">Classic</option>
                <option value="Multiplayer">Multiplayer</option>
              </select>
            </div>
            <div>
              <label class="block text-slate-300 mb-1">Canvas Engine Key</label>
              <select id="gEngine" class="w-full px-3 py-2 bg-black/50 border border-white/[0.1] rounded-lg text-white">
                <option value="space-blaster">space-blaster</option>
                <option value="flappy-bird">flappy-bird</option>
                <option value="retro-snake">retro-snake</option>
                <option value="cyber-pong">cyber-pong</option>
              </select>
            </div>
          </div>

          <div>
            <label class="block text-slate-300 mb-1">Thumbnail Image URL</label>
            <input type="url" id="gThumbnail" required placeholder="https://images.unsplash.com/..."
                   class="w-full px-3 py-2 bg-black/50 border border-white/[0.1] rounded-lg text-white">
          </div>

          <div>
            <label class="block text-slate-300 mb-1">Description</label>
            <textarea id="gDesc" required rows="2" placeholder="Brief gameplay summary..."
                      class="w-full px-3 py-2 bg-black/50 border border-white/[0.1] rounded-lg text-white"></textarea>
          </div>

          <div>
            <label class="block text-slate-300 mb-1">Rules (One per line)</label>
            <textarea id="gRules" rows="3" placeholder="Controls and scoring rules..."
                      class="w-full px-3 py-2 bg-black/50 border border-white/[0.1] rounded-lg text-white"></textarea>
          </div>

          <button type="submit" class="btn-pro-primary w-full py-2.5 text-xs font-bold font-mono-stat">
            Save Game Roster Record
          </button>
        </form>
      </div>
    </div>

    <footer class="p-4 border-t border-white/[0.06] text-center text-[11px] text-slate-600 font-mono-stat">
      PRO ARENA 2D • GAME ROSTER DATABASE
    </footer>
  </div>

  <script src="../assets/js/db.js"></script>
  <script>
    function initGamesPage() {
      WapDB.init();
      renderGames();
    }

    function renderGames() {
      const games = WapDB.getGames();
      const container = document.getElementById('adminGamesGrid');
      container.innerHTML = games.map(g => `
        <div class="pro-card p-4 bg-proSurface border-white/[0.08] flex flex-col justify-between">
          <div>
            <div class="h-32 rounded-lg overflow-hidden bg-black mb-3 relative">
              <img src="${g.thumbnail}" class="w-full h-full object-cover">
              <span class="absolute top-2 left-2 badge-pro badge-pro-bracket text-[10px]">${g.category}</span>
            </div>
            <h3 class="font-bold text-white text-base font-heading mb-1">${g.title}</h3>
            <p class="text-xs text-slate-400 line-clamp-2 mb-3">${g.description}</p>
            <div class="text-[11px] font-mono-stat text-slate-500 mb-4">
              <span>ENGINE: ${g.engineKey}</span> • <span>${g.playsCount || 0} Runs</span>
            </div>
          </div>

          <div class="flex items-center gap-2 pt-3 border-t border-white/[0.06]">
            <button onclick="editGame('${g.id}')" class="btn-pro-secondary flex-1 py-1.5 text-xs font-mono-stat">
              <i class="fa-solid fa-pen mr-1"></i> Edit
            </button>
            <button onclick="deleteGame('${g.id}')" class="px-3 py-1.5 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 text-xs font-mono-stat">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        </div>
      `).join('');
    }

    function openGameModal() {
      document.getElementById('editGameId').value = '';
      document.getElementById('gTitle').value = '';
      document.getElementById('gThumbnail').value = 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=500';
      document.getElementById('gDesc').value = '';
      document.getElementById('gRules').value = 'Use Arrow Keys to steer.\nCollect points and avoid obstacles.';
      document.getElementById('modalHeading').innerText = 'Deploy New Game';
      document.getElementById('gameModal').classList.remove('hidden');
    }

    function editGame(id) {
      const g = WapDB.getGameById(id);
      if (!g) return;
      document.getElementById('editGameId').value = g.id;
      document.getElementById('gTitle').value = g.title;
      document.getElementById('gCategory').value = g.category;
      document.getElementById('gEngine').value = g.engineKey;
      document.getElementById('gThumbnail').value = g.thumbnail;
      document.getElementById('gDesc').value = g.description;
      document.getElementById('gRules').value = (g.rules || []).join('\n');
      document.getElementById('modalHeading').innerText = 'Edit Game Title';
      document.getElementById('gameModal').classList.remove('hidden');
    }

    function closeGameModal() {
      document.getElementById('gameModal').classList.add('hidden');
    }

    function handleSaveGame(e) {
      e.preventDefault();
      const id = document.getElementById('editGameId').value;
      const gameData = {
        title: document.getElementById('gTitle').value.trim(),
        category: document.getElementById('gCategory').value,
        engineKey: document.getElementById('gEngine').value,
        thumbnail: document.getElementById('gThumbnail').value.trim(),
        description: document.getElementById('gDesc').value.trim(),
        rules: document.getElementById('gRules').value.split('\n').filter(r => r.trim().length > 0)
      };
      if (id) gameData.id = id;
      WapDB.saveGame(gameData);
      closeGameModal();
      renderGames();
    }

    function deleteGame(id) {
      if (confirm('Delete this game title from the portal?')) {
        WapDB.deleteGame(id);
        renderGames();
      }
    }

    document.addEventListener('DOMContentLoaded', initGamesPage);
  </script>
</body>
</html>
