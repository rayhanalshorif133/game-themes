<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player Career & Profile - WAP Arena Theme 2</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            esportsDark: '#0c0d12',
            esportsCard: '#151720',
            esportsRed: '#ef4444',
            esportsGold: '#f59e0b',
            esportsBorder: '#262a3b'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/theme2.css">
</head>
<body class="bg-esportsDark text-slate-100 min-h-screen flex flex-col pb-20 md:pb-8 selection:bg-red-500">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-esportsDark/95 backdrop-blur-md border-b border-esportsBorder">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="index.html" class="p-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-300 text-xs flex items-center gap-1.5 transition">
          <i class="fa-solid fa-arrow-left"></i>
          <span class="font-esports">Lobby</span>
        </a>
        <h1 class="text-base sm:text-lg font-bold font-esports text-white">PLAYER PROFILE</h1>
      </div>

      <div class="flex items-center gap-2 sm:gap-3">
        <a href="wallet.html" class="px-3 py-1.5 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs font-mono font-bold">
          🪙 <span id="navTokenBadge">0</span>
        </a>
        <button onclick="handleLogout()" class="p-2 rounded-xl bg-slate-900 hover:bg-red-950 text-slate-400 hover:text-red-300 border border-slate-800 transition" title="Logout">
          <i class="fa-solid fa-power-off text-xs"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto px-4 py-6 w-full flex-1">
    
    <!-- Hero Profile Box -->
    <div class="p-6 sm:p-8 rounded-3xl esports-card border border-esportsBorder mb-8 relative overflow-hidden">
      <div class="flex flex-col md:flex-row items-center md:items-start justify-between gap-6 text-center md:text-left">
        <div class="flex flex-col sm:flex-row items-center gap-5">
          <div class="w-24 h-24 rounded-2xl bg-gradient-to-tr from-red-600 via-amber-600 to-yellow-500 flex items-center justify-center text-4xl shadow-xl shadow-red-600/30 border-2 border-amber-400/50" id="avatarDisplay">
            🔥
          </div>
          <div>
            <div class="flex items-center justify-center md:justify-start gap-2">
              <h2 class="text-2xl sm:text-3xl font-bold font-esports text-white" id="profileName">Player Name</h2>
              <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-amber-500/20 text-amber-400 font-esports">PRO GAMER</span>
            </div>
            <p class="text-xs text-red-400 font-mono mt-0.5" id="profileGamerTag">@esports_pro</p>
            <p class="text-xs text-slate-300 mt-2 max-w-md italic" id="profileBioText">
              "2D Battle Arena & Tournament Challenger"
            </p>
            <div class="flex flex-wrap items-center justify-center md:justify-start gap-3 mt-3 text-xs text-slate-400 font-mono">
              <span class="text-slate-300"><i class="fa-solid fa-phone text-slate-500"></i> <span id="profilePhone">017XXXXXXXX</span></span>
              <span>•</span>
              <span class="text-amber-400"><i class="fa-solid fa-tag"></i> <span id="profileRefCode">WAP-XXX</span></span>
            </div>
          </div>
        </div>

        <div class="flex flex-col gap-2 w-full sm:w-auto">
          <a href="subscription.html" class="btn-fire px-4 py-2 rounded-xl text-xs text-center">
            <i class="fa-solid fa-bolt"></i> Manage Pass
          </a>
          <button onclick="shareReferralDirect()" class="btn-gold px-4 py-2 rounded-xl text-xs text-center">
            <i class="fa-brands fa-whatsapp"></i> Share on WhatsApp
          </button>
        </div>
      </div>

      <!-- Quick KPI Numbers -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-8 pt-6 border-t border-slate-800">
        <div class="p-3 rounded-xl bg-slate-950 border border-slate-800 text-center">
          <div class="text-[10px] text-slate-400 uppercase font-esports">Career Score</div>
          <div class="text-2xl font-bold font-esports text-amber-400" id="statTotalScore">0</div>
        </div>
        <div class="p-3 rounded-xl bg-slate-950 border border-slate-800 text-center">
          <div class="text-[10px] text-slate-400 uppercase font-esports">Tokens</div>
          <div class="text-2xl font-bold font-mono text-amber-300" id="statTokenCount">0 🪙</div>
        </div>
        <div class="p-3 rounded-xl bg-slate-950 border border-slate-800 text-center">
          <div class="text-[10px] text-slate-400 uppercase font-esports">Refers</div>
          <div class="text-2xl font-bold font-esports text-emerald-400" id="statRefCount">0</div>
        </div>
        <div class="p-3 rounded-xl bg-slate-950 border border-slate-800 text-center">
          <div class="text-[10px] text-slate-400 uppercase font-esports">Pass Status</div>
          <div class="text-sm font-bold text-red-400 mt-1 truncate" id="statSubsTitle">Loading...</div>
        </div>
      </div>
    </div>

    <!-- Tabs Header -->
    <div class="flex items-center gap-2 overflow-x-auto pb-2 border-b border-esportsBorder mb-6">
      <button onclick="switchTab('games')" id="tabBtnGames" class="p-tab active px-4 py-2 rounded-xl text-xs font-bold font-esports bg-red-600 text-white whitespace-nowrap">
        Game Records
      </button>
      <button onclick="switchTab('edit')" id="tabBtnEdit" class="p-tab px-4 py-2 rounded-xl text-xs font-bold font-esports bg-slate-900 text-slate-300 hover:text-white whitespace-nowrap">
        Edit Info & Password
      </button>
      <button onclick="switchTab('inbox')" id="tabBtnInbox" class="p-tab px-4 py-2 rounded-xl text-xs font-bold font-esports bg-slate-900 text-slate-300 hover:text-white whitespace-nowrap">
        Admin Messages (<span id="inboxBadge">0</span>)
      </button>
      <button onclick="switchTab('receipts')" id="tabBtnReceipts" class="p-tab px-4 py-2 rounded-xl text-xs font-bold font-esports bg-slate-900 text-slate-300 hover:text-white whitespace-nowrap">
        Payment Receipts
      </button>
    </div>

    <!-- Tab 1: Games Scores -->
    <section id="tabContentGames" class="tab-pane space-y-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4" id="gamesScoreCards">
        <!-- Injected by JS -->
      </div>
    </section>

    <!-- Tab 2: Edit Info -->
    <section id="tabContentEdit" class="tab-pane hidden space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="p-6 rounded-3xl esports-card border border-esportsBorder">
          <h3 class="text-base font-bold font-esports text-white mb-4">Update Profile Details</h3>
          <form onsubmit="handleUpdateProfile(event)" class="space-y-3.5">
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">Full Name</label>
              <input type="text" id="editNameInput" required class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-xs text-white">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">Gamer Tag</label>
              <input type="text" id="editTagInput" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-xs text-white font-mono">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">Phone</label>
              <input type="tel" id="editPhoneInput" required class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-xs text-white font-mono">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">Bio</label>
              <textarea id="editBioInput" rows="2" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-xs text-white"></textarea>
            </div>
            <button type="submit" class="btn-fire w-full py-2.5 rounded-xl text-xs">Save Changes</button>
          </form>
        </div>

        <div class="p-6 rounded-3xl esports-card border border-esportsBorder">
          <h3 class="text-base font-bold font-esports text-white mb-4">Change Password</h3>
          <form onsubmit="handleChangePassword(event)" class="space-y-3.5">
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">Current Password</label>
              <input type="password" id="currentPassInput" required class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-xs text-white">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">New Password</label>
              <input type="password" id="newPassInput" required class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-xs text-white">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">Confirm New Password</label>
              <input type="password" id="confirmPassInput" required class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-xs text-white">
            </div>
            <button type="submit" class="btn-gold w-full py-2.5 rounded-xl text-xs">Update Password</button>
          </form>
        </div>
      </div>
    </section>

    <!-- Tab 3: Admin Messages -->
    <section id="tabContentInbox" class="tab-pane hidden space-y-3" id="profileInboxList">
      <!-- Injected by JS -->
    </section>

    <!-- Tab 4: Receipts -->
    <section id="tabContentReceipts" class="tab-pane hidden">
      <div class="rounded-3xl esports-card border border-esportsBorder overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-xs text-left">
            <thead class="bg-slate-950 text-slate-400 uppercase text-[10px]">
              <tr>
                <th class="py-2.5 px-4">Date</th>
                <th class="py-2.5 px-4">Plan</th>
                <th class="py-2.5 px-4">Amount</th>
                <th class="py-2.5 px-4">Method</th>
                <th class="py-2.5 px-4">TrxID</th>
              </tr>
            </thead>
            <tbody id="profileSubsTbody" class="divide-y divide-slate-800"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script src="../../assets/js/db.js"></script>
  <script>
    let currentUser = null;

    document.addEventListener('DOMContentLoaded', () => {
      currentUser = window.wapDB.getCurrentUser();
      if (!currentUser) {
        window.location.href = 'login.html';
        return;
      }
      loadProfileData();
    });

    function loadProfileData() {
      currentUser = window.wapDB.getPlayerById(currentUser.id) || currentUser;

      document.getElementById('profileName').innerText = currentUser.name;
      document.getElementById('profilePhone').innerText = currentUser.phone;
      document.getElementById('profileRefCode').innerText = currentUser.referralCode || 'N/A';
      document.getElementById('avatarDisplay').innerText = currentUser.avatar || '🔥';
      document.getElementById('profileGamerTag').innerText = currentUser.gamerTag || `@${currentUser.name.toLowerCase().replace(/\s+/g, '_')}`;
      document.getElementById('profileBioText').innerText = currentUser.bio || '2D Battle Arena & Tournament Challenger';

      const pScores = currentUser.scores || {};
      let totalPts = 0;
      Object.values(pScores).forEach(s => totalPts += s);
      document.getElementById('statTotalScore').innerText = totalPts.toLocaleString();
      document.getElementById('statTokenCount').innerText = `${currentUser.tokens || 0} 🪙`;
      document.getElementById('statRefCount').innerText = currentUser.referralCount || 0;
      document.getElementById('navTokenBadge').innerText = currentUser.tokens || 0;

      const hasSubs = window.wapDB.hasActiveSubscription(currentUser);
      document.getElementById('statSubsTitle').innerText = hasSubs ? currentUser.subscription.planName : 'No Active Pass';

      document.getElementById('editNameInput').value = currentUser.name;
      document.getElementById('editTagInput').value = currentUser.gamerTag || '';
      document.getElementById('editPhoneInput').value = currentUser.phone;
      document.getElementById('editBioInput').value = currentUser.bio || '';

      renderGameRecords();
      renderInboxMessages();
      renderReceipts();
    }

    function switchTab(tabId) {
      document.querySelectorAll('.p-tab').forEach(b => {
        b.className = 'p-tab px-4 py-2 rounded-xl text-xs font-bold font-esports bg-slate-900 text-slate-300 hover:text-white whitespace-nowrap';
      });
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.add('hidden'));

      if (tabId === 'games') {
        document.getElementById('tabContentGames').classList.remove('hidden');
        document.getElementById('tabBtnGames').className = 'p-tab active px-4 py-2 rounded-xl text-xs font-bold font-esports bg-red-600 text-white whitespace-nowrap';
      } else if (tabId === 'edit') {
        document.getElementById('tabContentEdit').classList.remove('hidden');
        document.getElementById('tabBtnEdit').className = 'p-tab active px-4 py-2 rounded-xl text-xs font-bold font-esports bg-red-600 text-white whitespace-nowrap';
      } else if (tabId === 'inbox') {
        document.getElementById('tabContentInbox').classList.remove('hidden');
        document.getElementById('tabBtnInbox').className = 'p-tab active px-4 py-2 rounded-xl text-xs font-bold font-esports bg-red-600 text-white whitespace-nowrap';
      } else if (tabId === 'receipts') {
        document.getElementById('tabContentReceipts').classList.remove('hidden');
        document.getElementById('tabBtnReceipts').className = 'p-tab active px-4 py-2 rounded-xl text-xs font-bold font-esports bg-red-600 text-white whitespace-nowrap';
      }
    }

    function renderGameRecords() {
      const allGames = window.wapDB.getGames();
      const container = document.getElementById('gamesScoreCards');
      const pScores = currentUser.scores || {};

      container.innerHTML = allGames.map(g => {
        const score = pScores[g.id] || 0;
        return `
          <div class="esports-card rounded-2xl p-4 flex flex-col justify-between">
            <div class="flex items-center gap-3 mb-3">
              <img src="${g.thumbnail}" alt="${g.title}" class="w-12 h-12 rounded-xl object-cover">
              <div>
                <h4 class="text-xs font-bold font-esports text-white">${g.title}</h4>
                <span class="text-[10px] text-red-400 font-bold font-esports">${g.category}</span>
              </div>
            </div>
            <div class="p-2.5 rounded-xl bg-slate-950 border border-slate-800 flex items-center justify-between mb-3 font-mono">
              <span class="text-[11px] text-slate-400">Personal Best:</span>
              <span class="text-base font-bold text-amber-400">${score}</span>
            </div>
            <a href="play.html?id=${g.id}" class="btn-fire w-full py-1.5 rounded-xl text-xs text-center block">Play Arena</a>
          </div>
        `;
      }).join('');
    }

    function renderInboxMessages() {
      const msgs = currentUser.messages || [];
      const list = document.getElementById('tabContentInbox');
      document.getElementById('inboxBadge').innerText = msgs.length;

      if (msgs.length === 0) {
        list.innerHTML = `<p class="p-6 text-center text-slate-500 text-xs esports-card rounded-2xl">No messages from Admin yet.</p>`;
        return;
      }

      list.innerHTML = msgs.map(m => `
        <div class="p-4 rounded-2xl esports-card border border-esportsBorder">
          <div class="flex items-center justify-between mb-1 text-xs">
            <span class="font-bold text-amber-400 font-esports">${m.from || 'Admin'}</span>
            <span class="text-slate-500 font-mono text-[10px]">${m.date}</span>
          </div>
          <p class="text-xs text-slate-300">${m.text}</p>
        </div>
      `).join('');
    }

    function renderReceipts() {
      const history = window.wapDB.getSubscriptionHistory().filter(t => t.playerId === currentUser.id);
      const tbody = document.getElementById('profileSubsTbody');
      if (history.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-slate-500">No payment receipts found.</td></tr>`;
        return;
      }
      tbody.innerHTML = history.map(t => `
        <tr class="hover:bg-slate-900">
          <td class="py-2.5 px-4 font-mono text-slate-400">${t.date}</td>
          <td class="py-2.5 px-4 font-bold text-white">${t.planName}</td>
          <td class="py-2.5 px-4 font-mono text-amber-400 font-bold">${t.amount}</td>
          <td class="py-2.5 px-4">${t.method}</td>
          <td class="py-2.5 px-4 font-mono text-slate-400">${t.trxId}</td>
        </tr>
      `).join('');
    }

    function handleUpdateProfile(e) {
      e.preventDefault();
      currentUser.name = document.getElementById('editNameInput').value.trim();
      currentUser.gamerTag = document.getElementById('editTagInput').value.trim();
      currentUser.phone = document.getElementById('editPhoneInput').value.trim();
      currentUser.bio = document.getElementById('editBioInput').value.trim();

      window.wapDB.savePlayer(currentUser);
      alert('Profile updated successfully!');
      loadProfileData();
    }

    function handleChangePassword(e) {
      e.preventDefault();
      const current = document.getElementById('currentPassInput').value;
      const newP = document.getElementById('newPassInput').value;
      const confirmP = document.getElementById('confirmPassInput').value;

      if (current !== currentUser.password) {
        alert('Current password incorrect!');
        return;
      }
      if (newP !== confirmP) {
        alert('New passwords do not match!');
        return;
      }

      currentUser.password = newP;
      window.wapDB.savePlayer(currentUser);
      alert('Password updated successfully!');
    }

    function shareReferralDirect() {
      const code = currentUser.referralCode || 'WAP-VIP';
      const origin = window.location.origin + window.location.pathname.replace('profile.html', 'login.html');
      const text = encodeURIComponent(`🎮 Play 2D Games & Win Daily bKash Cash on WAP Arena! Signup with code ${code} for 50 Free Tokens: ${origin}?ref=${code}`);
      window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');
    }

    function handleLogout() {
      if (confirm('Log out from WAP Arena?')) {
        window.wapDB.logout();
        window.location.href = 'login.html';
      }
    }
  </script>
</body>
</html>
