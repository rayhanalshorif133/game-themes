<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro Player Sign In - PRO ARENA 2D</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            proDark: '#08090C',
            proSurface: '#10131A',
            proElevated: '#161B26',
            proAccent: '#6366F1',
            proViolet: '#8B5CF6'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/theme4.css">
</head>
<body class="bg-proDark text-slate-100 min-h-screen flex flex-col justify-between selection:bg-proAccent selection:text-white">

  <!-- Header -->
  <header class="bg-proDark/90 border-b border-white/[0.08] px-4 py-3 sticky top-0 z-30">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <a href="../index.html" class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-proElevated border border-white/[0.1] flex items-center justify-center text-proAccent text-sm">
          <i class="fa-solid fa-crosshairs"></i>
        </div>
        <div>
          <span class="font-heading font-bold text-sm tracking-tight text-white">PRO ARENA 2D</span>
          <span class="text-[9px] block text-slate-400 font-mono-stat -mt-0.5">THEME 4 MINIMALIST</span>
        </div>
      </a>

      <div class="flex items-center gap-2">
        <a href="../index.html" class="px-2.5 py-1 text-xs font-mono-stat text-slate-400 hover:text-white transition">
          <i class="fa-solid fa-arrow-left mr-1"></i> Back to Arena
        </a>
      </div>
    </div>
  </header>

  <!-- Main Card -->
  <main class="max-w-md mx-auto px-4 py-12 w-full flex-1 flex flex-col justify-center">
    
    <div class="pro-card p-6 sm:p-8 bg-proSurface border-white/[0.1]">
      
      <!-- Top Title -->
      <div class="text-center mb-6">
        <div class="w-12 h-12 rounded-xl bg-proElevated border border-white/[0.1] text-proAccent flex items-center justify-center text-xl mx-auto mb-3 shadow-sm">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h1 class="text-2xl font-bold text-white font-heading tracking-tight" id="authTitle">Sign In to Pro Arena</h1>
        <p class="text-xs text-slate-400 mt-1 font-mono-stat" id="authSub">Access matches, tournaments, wallet & clan stats</p>
      </div>

      <!-- Tab Switcher -->
      <div class="grid grid-cols-2 gap-1 p-1 rounded-xl bg-black/40 border border-white/[0.06] mb-6 text-xs font-semibold font-mono-stat">
        <button id="tabLogin" onclick="switchTab('login')" class="py-2 rounded-lg bg-proElevated text-white transition">
          SIGN IN
        </button>
        <button id="tabSignup" onclick="switchTab('signup')" class="py-2 rounded-lg text-slate-400 hover:text-white transition">
          SIGN UP (+50 🪙)
        </button>
      </div>

      <!-- Alert Box -->
      <div id="alertBox" class="hidden mb-4 p-3 rounded-lg text-xs font-mono-stat"></div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 font-mono-stat mb-1.5 uppercase tracking-wider">
            Mobile Number (11 Digits)
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500 text-xs">
              <i class="fa-solid fa-phone"></i>
            </span>
            <input type="tel" id="loginPhone" required placeholder="01700000000" maxlength="11"
                   class="w-full pl-9 pr-3 py-2.5 bg-black/50 border border-white/[0.1] rounded-lg text-xs text-white placeholder-slate-600 focus:outline-none focus:border-proAccent font-mono-stat">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 font-mono-stat mb-1.5 uppercase tracking-wider">
            4-Digit PIN
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500 text-xs">
              <i class="fa-solid fa-lock"></i>
            </span>
            <input type="password" id="loginPin" required placeholder="••••" maxlength="4"
                   class="w-full pl-9 pr-3 py-2.5 bg-black/50 border border-white/[0.1] rounded-lg text-xs text-white placeholder-slate-600 focus:outline-none focus:border-proAccent font-mono-stat tracking-widest">
          </div>
        </div>

        <button type="submit" class="btn-pro-primary w-full py-2.5 text-xs font-bold uppercase tracking-wider font-mono-stat mt-2">
          Sign In Now
        </button>
      </form>

      <!-- Signup Form -->
      <form id="signupForm" onsubmit="handleSignup(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-semibold text-slate-300 font-mono-stat mb-1.5 uppercase tracking-wider">
            Gamer Tag / Full Name
          </label>
          <input type="text" id="regName" required placeholder="e.g. Sabbir Pro"
                 class="w-full px-3 py-2.5 bg-black/50 border border-white/[0.1] rounded-lg text-xs text-white placeholder-slate-600 focus:outline-none focus:border-proAccent">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 font-mono-stat mb-1.5 uppercase tracking-wider">
            Clan / Team Tag
          </label>
          <input type="text" id="regClan" placeholder="e.g. TITAN, VIPER, APEX, SOLO" maxlength="8"
                 class="w-full px-3 py-2.5 bg-black/50 border border-white/[0.1] rounded-lg text-xs text-white placeholder-slate-600 focus:outline-none focus:border-proAccent font-mono-stat uppercase">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 font-mono-stat mb-1.5 uppercase tracking-wider">
            Mobile Number (bKash / Nagad)
          </label>
          <input type="tel" id="regPhone" required placeholder="01712345678" maxlength="11"
                 class="w-full px-3 py-2.5 bg-black/50 border border-white/[0.1] rounded-lg text-xs text-white placeholder-slate-600 focus:outline-none focus:border-proAccent font-mono-stat">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 font-mono-stat mb-1.5 uppercase tracking-wider">
            Set 4-Digit Security PIN
          </label>
          <input type="password" id="regPin" required placeholder="••••" maxlength="4"
                 class="w-full px-3 py-2.5 bg-black/50 border border-white/[0.1] rounded-lg text-xs text-white placeholder-slate-600 focus:outline-none focus:border-proAccent font-mono-stat tracking-widest">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 font-mono-stat mb-1.5">
            Referral Code (Optional)
          </label>
          <input type="text" id="regReferral" placeholder="TITAN_SABBIR"
                 class="w-full px-3 py-2 bg-black/30 border border-white/[0.08] rounded-lg text-xs text-slate-300 placeholder-slate-600 focus:outline-none focus:border-proAccent font-mono-stat uppercase">
        </div>

        <button type="submit" class="btn-pro-primary w-full py-2.5 text-xs font-bold uppercase tracking-wider font-mono-stat mt-2">
          Claim 50 Free Tokens & Sign Up
        </button>
      </form>

      <!-- Quick Demo Login Button -->
      <div class="mt-6 pt-5 border-t border-white/[0.06] text-center">
        <span class="text-[11px] text-slate-500 block mb-2 font-mono-stat">TESTING WITH DEMO ACCOUNT:</span>
        <button onclick="fillDemo()" class="btn-pro-secondary w-full py-2 text-xs font-mono-stat text-slate-300">
          <i class="fa-solid fa-bolt text-amber-400 mr-1"></i> Auto-fill Demo User (01700000000)
        </button>
      </div>

    </div>

  </main>

  <footer class="py-4 text-center text-[11px] text-slate-600 border-t border-white/[0.06] font-mono-stat">
    PRO ARENA 2D • SECURE E-SPORTS AUTHENTICATION
  </footer>

  <script src="../assets/js/db.js"></script>
  <script>
    let currentMode = 'login';

    function switchTab(mode) {
      currentMode = mode;
      const tabLogin = document.getElementById('tabLogin');
      const tabSignup = document.getElementById('tabSignup');
      const loginForm = document.getElementById('loginForm');
      const signupForm = document.getElementById('signupForm');
      const authTitle = document.getElementById('authTitle');
      const authSub = document.getElementById('authSub');

      if (mode === 'login') {
        tabLogin.classList.add('bg-proElevated', 'text-white');
        tabLogin.classList.remove('text-slate-400');
        tabSignup.classList.remove('bg-proElevated', 'text-white');
        tabSignup.classList.add('text-slate-400');
        loginForm.classList.remove('hidden');
        signupForm.classList.add('hidden');
        authTitle.innerText = 'Sign In to Pro Arena';
        authSub.innerText = 'Access matches, tournaments, wallet & clan stats';
      } else {
        tabSignup.classList.add('bg-proElevated', 'text-white');
        tabSignup.classList.remove('text-slate-400');
        tabLogin.classList.remove('bg-proElevated', 'text-white');
        tabLogin.classList.add('text-slate-400');
        signupForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
        authTitle.innerText = 'Create Pro Gamer Account';
        authSub.innerText = 'Sign up now and receive 50 Free Tokens instantly!';
      }
    }

    function showAlert(msg, isSuccess = false) {
      const box = document.getElementById('alertBox');
      box.className = `mb-4 p-3 rounded-lg text-xs font-mono-stat ${isSuccess ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-rose-500/10 text-rose-400 border border-rose-500/20'}`;
      box.innerHTML = msg;
      box.classList.remove('hidden');
    }

    function handleLogin(e) {
      e.preventDefault();
      const phone = document.getElementById('loginPhone').value.trim();
      const pin = document.getElementById('loginPin').value.trim();
      const res = WapDB.login(phone, pin);
      if (res.success) {
        showAlert('Sign in verified! Redirecting to Arena...', true);
        setTimeout(() => window.location.href = 'index.html', 800);
      } else {
        showAlert(res.message);
      }
    }

    function handleSignup(e) {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const clan = document.getElementById('regClan').value.trim() || 'SOLO';
      const phone = document.getElementById('regPhone').value.trim();
      const pin = document.getElementById('regPin').value.trim();
      const referral = document.getElementById('regReferral').value.trim();

      const res = WapDB.signup(name, phone, pin, referral, clan);
      if (res.success) {
        showAlert(`Account verified! Credited ${res.bonusTokens} Bonus Tokens. Redirecting...`, true);
        setTimeout(() => window.location.href = 'index.html', 1000);
      } else {
        showAlert(res.message);
      }
    }

    function fillDemo() {
      switchTab('login');
      document.getElementById('loginPhone').value = '01700000000';
      document.getElementById('loginPin').value = '1234';
    }
  </script>
</body>
</html>
